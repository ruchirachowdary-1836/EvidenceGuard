<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" role="img" aria-labelledby="t d">
  <title id="t">Animated preview of the EvidenceGuard queue</title>
  <desc id="d">Alerts stream into a ranked queue; risk and stability bars fill; ranks reshuffle when redundancy-aware ranking turns on.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="#ffffff55"/></pattern>
    <clipPath id="c"><rect width="1100" height="430" rx="18"/></clipPath>
    <style>
      .tx{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
      .mono{font-family:Consolas,"Cascadia Mono",monospace}
      .row{opacity:0;animation:row 14s infinite}
      @keyframes row{0%{opacity:0;transform:translateX(-30px)}5%,88%{opacity:1;transform:none}95%,100%{opacity:0;transform:translateX(30px)}}
      .rb{transform-box:fill-box;transform-origin:left;animation:fill 14s infinite}
      @keyframes fill{0%,2%{transform:scaleX(0)}10%,88%{transform:scaleX(1)}95%,100%{transform:scaleX(0)}}
      .live{animation:blink 1.3s infinite}
      @keyframes blink{50%{opacity:.25}}
      .card{opacity:0;animation:card 7s infinite}
      @keyframes card{0%{opacity:0;transform:translateX(60px) scale(.9)}8%,70%{opacity:1;transform:none}85%,100%{opacity:0;transform:translateX(-40px)}}
      .glowrow{animation:gl 14s infinite}
      @keyframes gl{0%,40%{opacity:0}48%,60%{opacity:.9}68%,100%{opacity:0}}
      .swapA{animation:swapA 14s infinite}
      @keyframes swapA{0%,45%{transform:translateY(0)}55%,92%{transform:translateY(46px)}100%{transform:translateY(0)}}
      .swapB{animation:swapB 14s infinite}
      @keyframes swapB{0%,45%{transform:translateY(0)}55%,92%{transform:translateY(-46px)}100%{transform:translateY(0)}}
      .toggle{animation:tog 14s infinite}
      @keyframes tog{0%,45%{transform:translateX(0)}55%,92%{transform:translateX(112px)}100%{transform:translateX(0)}}
      .lbl1{animation:l1 14s infinite}.lbl2{animation:l2 14s infinite}
      @keyframes l1{0%,45%{opacity:1}52%,92%{opacity:.35}100%{opacity:1}}
      @keyframes l2{0%,45%{opacity:.35}52%,92%{opacity:1}100%{opacity:.35}}
    </style>
  </defs>
  <g clip-path="url(#c)" class="tx">
    <rect width="1100" height="430" fill="#070a14"/>
    <rect width="1100" height="46" fill="#0d1322"/>
    <circle cx="26" cy="23" r="6" fill="#f43f5e"/><circle cx="46" cy="23" r="6" fill="#fbbf24"/><circle cx="66" cy="23" r="6" fill="#34d399"/>
    <text x="96" y="28" font-size="13" fill="#8793b8">EvidenceGuard analyst console - queue</text>
    <circle class="live" cx="936" cy="23" r="5" fill="#22d3ee"/><text x="948" y="28" font-size="12" fill="#67e8f9" letter-spacing="1.5">LIVE</text>

    <!-- method switch -->
    <rect x="28" y="64" width="232" height="30" rx="15" fill="#0a1020" stroke="#1f2a47"/>
    <rect class="toggle" x="30" y="66" width="112" height="26" rx="13" fill="url(#g)"/>
    <text class="lbl1" x="86" y="84" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">all components</text>
    <text class="lbl2" x="204" y="84" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">full + queue</text>
    <text x="280" y="84" font-size="12" fill="#8793b8">K = 12 / day      lambda = 0.30</text>

    <!-- header -->
    <g font-size="11" fill="#8793b8" letter-spacing="1.2">
      <text x="32" y="124">#</text><text x="76" y="124">TXN</text><text x="160" y="124">CLUSTER</text><text x="300" y="124">RISK p</text><text x="470" y="124">ANOMALY a</text><text x="590" y="124">STABILITY e</text><text x="770" y="124">TOP DRIVERS</text>
    </g>
    <line x1="24" y1="134" x2="800" y2="134" stroke="#1f2a47"/>

    <!-- rows -->
    <g transform="translate(0 140)">
      <g class="row" style="animation-delay:0s"><g class="swapA">
        <rect x="24" y="0" width="776" height="40" rx="8" fill="#131b30"/>
        <text x="34" y="25" font-size="13" fill="#8793b8" class="mono">1</text><text x="76" y="25" font-size="13" fill="#e6ebff" class="mono">#7056</text>
        <rect x="150" y="9" width="116" height="22" rx="6" fill="#f59e0b33" stroke="#f59e0b"/><text x="160" y="25" font-size="12" fill="#fde68a" class="mono">ringdev4 x6</text>
        <rect x="300" y="17" width="120" height="7" rx="3.5" fill="#1f2a47"/><rect class="rb" x="300" y="17" width="118" height="7" rx="3.5" fill="#f43f5e"/><text x="430" y="25" font-size="12" fill="#e6ebff" class="mono">98.7%</text>
        <rect x="470" y="17" width="70" height="7" rx="3.5" fill="#1f2a47"/><rect class="rb" x="470" y="17" width="56" height="7" rx="3.5" fill="#8b5cf6"/>
        <text x="590" y="26" font-size="12" fill="#22d3ee">&#9650;</text><rect x="608" y="17" width="90" height="7" rx="3.5" fill="none" stroke="#22d3ee66"/><rect class="rb" x="608" y="17" width="62" height="7" rx="3.5" fill="#22d3ee"/><text x="706" y="25" font-size="11" fill="#8793b8">shaky</text>
        <text x="770" y="25" font-size="12" fill="#8793b8">new email, product, hour</text></g></g>
      <g class="row" style="animation-delay:.4s"><g class="swapB">
        <rect x="24" y="46" width="776" height="40" rx="8" fill="#131b30"/>
        <text x="34" y="71" font-size="13" fill="#8793b8" class="mono">2</text><text x="76" y="71" font-size="13" fill="#e6ebff" class="mono">#7100</text>
        <rect x="150" y="55" width="116" height="22" rx="6" fill="#38bdf833" stroke="#38bdf8"/><text x="160" y="71" font-size="12" fill="#bae6fd" class="mono">dev84a</text>
        <rect x="300" y="63" width="120" height="7" rx="3.5" fill="#1f2a47"/><rect class="rb" x="300" y="63" width="112" height="7" rx="3.5" fill="#f43f5e"/><text x="430" y="71" font-size="12" fill="#e6ebff" class="mono">93.1%</text>
        <rect x="470" y="63" width="70" height="7" rx="3.5" fill="#1f2a47"/><rect class="rb" x="470" y="63" width="44" height="7" rx="3.5" fill="#8b5cf6"/>
        <text x="590" y="72" font-size="12" fill="#22d3ee">&#9670;</text><rect x="608" y="63" width="90" height="7" rx="3.5" fill="none" stroke="#22d3ee66"/><rect class="rb" x="608" y="63" width="80" height="7" rx="3.5" fill="#22d3ee"/><text x="706" y="71" font-size="11" fill="#8793b8">stable</text>
        <text x="770" y="71" font-size="12" fill="#8793b8">amount vs history, device</text></g></g>
      <g class="row" style="animation-delay:.8s">
        <rect x="24" y="92" width="776" height="40" rx="8" fill="#131b30"/>
        <text x="34" y="117" font-size="13" fill="#8793b8" class="mono">3</text><text x="76" y="117" font-size="13" fill="#e6ebff" class="mono">#7069</text>
        <rect x="150" y="101" width="116" height="22" rx="6" fill="#a855f733" stroke="#a855f7"/><text x="160" y="117" font-size="12" fill="#e9d5ff" class="mono">ringdev11 x2</text>
        <rect x="300" y="109" width="120" height="7" rx="3.5" fill="#1f2a47"/><rect class="rb" x="300" y="109" width="104" height="7" rx="3.5" fill="#f43f5e"/><text x="430" y="117" font-size="12" fill="#e6ebff" class="mono">86.4%</text>
        <rect x="470" y="109" width="70" height="7" rx="3.5" fill="#1f2a47"/><rect class="rb" x="470" y="109" width="52" height="7" rx="3.5" fill="#8b5cf6"/>
        <text x="590" y="118" font-size="12" fill="#22d3ee">&#9660;</text><rect x="608" y="109" width="90" height="7" rx="3.5" fill="none" stroke="#22d3ee66"/><rect class="rb" x="608" y="109" width="38" height="7" rx="3.5" fill="#22d3ee"/><text x="706" y="117" font-size="11" fill="#8793b8">unstable</text>
        <text x="770" y="117" font-size="12" fill="#8793b8">cluster activity 24h</text></g>
      <g class="row" style="animation-delay:1.2s">
        <rect x="24" y="138" width="776" height="40" rx="8" fill="#131b30"/>
        <text x="34" y="163" font-size="13" fill="#8793b8" class="mono">4</text><text x="76" y="163" font-size="13" fill="#e6ebff" class="mono">#7093</text>
        <rect x="150" y="147" width="116" height="22" rx="6" fill="#f59e0b33" stroke="#f59e0b"/><text x="160" y="163" font-size="12" fill="#fde68a" class="mono">ringdev4 x6</text>
        <rect x="300" y="155" width="120" height="7" rx="3.5" fill="#1f2a47"/><rect class="rb" x="300" y="155" width="96" height="7" rx="3.5" fill="#fbbf24"/><text x="430" y="163" font-size="12" fill="#e6ebff" class="mono">72.0%</text>
        <rect x="470" y="155" width="70" height="7" rx="3.5" fill="#1f2a47"/><rect class="rb" x="470" y="155" width="60" height="7" rx="3.5" fill="#8b5cf6"/>
        <text x="590" y="164" font-size="12" fill="#22d3ee">&#9650;</text><rect x="608" y="155" width="90" height="7" rx="3.5" fill="none" stroke="#22d3ee66"/><rect class="rb" x="608" y="155" width="58" height="7" rx="3.5" fill="#22d3ee"/><text x="706" y="163" font-size="11" fill="#8793b8">shaky</text>
        <text x="770" y="163" font-size="12" fill="#8793b8">product rarity, hour</text></g>
      <g class="row" style="animation-delay:1.6s">
        <rect x="24" y="184" width="776" height="40" rx="8" fill="#131b30"/>
        <text x="34" y="209" font-size="13" fill="#8793b8" class="mono">5</text><text x="76" y="209" font-size="13" fill="#e6ebff" class="mono">#7054</text>
        <rect x="150" y="193" width="116" height="22" rx="6" fill="#f59e0b33" stroke="#f59e0b"/><text x="160" y="209" font-size="12" fill="#fde68a" class="mono">ringdev4 x6</text>
        <rect x="300" y="201" width="120" height="7" rx="3.5" fill="#1f2a47"/><rect class="rb" x="300" y="201" width="80" height="7" rx="3.5" fill="#fbbf24"/><text x="430" y="209" font-size="12" fill="#e6ebff" class="mono">61.2%</text>
        <rect x="470" y="201" width="70" height="7" rx="3.5" fill="#1f2a47"/><rect class="rb" x="470" y="201" width="64" height="7" rx="3.5" fill="#8b5cf6"/>
        <text x="590" y="210" font-size="12" fill="#22d3ee">&#9670;</text><rect x="608" y="201" width="90" height="7" rx="3.5" fill="none" stroke="#22d3ee66"/><rect class="rb" x="608" y="201" width="72" height="7" rx="3.5" fill="#22d3ee"/><text x="706" y="209" font-size="11" fill="#8793b8">stable</text>
        <text x="770" y="209" font-size="12" fill="#8793b8">new device, amount</text></g>
      <rect class="glowrow" x="24" y="0" width="776" height="86" rx="10" fill="none" stroke="#22d3ee" stroke-width="2"/>
    </g>
    <text x="32" y="400" font-size="12" fill="#8793b8">Switching to the redundancy-aware queue reorders rows (rank movement is shown against plain p-only ranking) and spreads alerts across clusters.</text>

    <!-- live feed -->
    <text x="836" y="64" font-size="12" fill="#8793b8" letter-spacing="1.5">LIVE CANDIDATE FEED</text>
    <g class="card" style="animation-delay:0s"><rect x="836" y="82" width="240" height="64" rx="12" fill="#131b30" stroke="#f43f5e88"/><text x="850" y="104" font-size="11" fill="#8793b8" class="mono">#6720  11:11</text><text x="850" y="132" font-size="22" fill="#e6ebff" class="mono">100%</text><text x="940" y="132" font-size="12" fill="#8793b8" class="mono">$37.75  ringdev12</text></g>
    <g class="card" style="animation-delay:1.7s"><rect x="836" y="158" width="240" height="64" rx="12" fill="#131b30" stroke="#1f2a47"/><text x="850" y="180" font-size="11" fill="#8793b8" class="mono">#6727  11:44</text><text x="850" y="208" font-size="22" fill="#e6ebff" class="mono">4%</text><text x="940" y="208" font-size="12" fill="#8793b8" class="mono">$13.53  dev269a</text></g>
    <g class="card" style="animation-delay:3.4s"><rect x="836" y="234" width="240" height="64" rx="12" fill="#131b30" stroke="#f43f5e88"/><text x="850" y="256" font-size="11" fill="#8793b8" class="mono">#6700  09:49</text><text x="850" y="284" font-size="22" fill="#e6ebff" class="mono">100%</text><text x="940" y="284" font-size="12" fill="#8793b8" class="mono">$50.10  ringdev12</text></g>
    <rect x="836" y="316" width="240" height="64" rx="12" fill="none" stroke="#1f2a47" stroke-dasharray="5 5"/><text x="956" y="353" font-size="12" fill="#5b6592" text-anchor="middle">held-out replay, not live traffic</text>
  </g>
  <rect x=".5" y=".5" width="1099" height="429" rx="18" fill="none" stroke="#1f2a47"/>
</svg>
