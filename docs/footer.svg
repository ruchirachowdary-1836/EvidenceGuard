<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-labelledby="t">
  <title id="t">EvidenceGuard footer</title>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/>
      <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/><animate attributeName="x2" values="1;0;1" dur="8s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".4"/><stop offset=".4" stop-color="#22d3ee" stop-opacity=".04"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".5"/><stop offset=".4" stop-color="#8b5cf6" stop-opacity=".05"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="1200" height="220" rx="22"/></clipPath>
    <style>
      .tx{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
      .tick{animation:tick 3s ease-in-out infinite}
      @keyframes tick{50%{opacity:.4}}
      .beat{transform-box:fill-box;transform-origin:center;animation:beat 1.8s ease-in-out infinite}
      @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
      .spark{animation:spark 6s linear infinite}
      @keyframes spark{from{transform:translateX(-200px)}to{transform:translateX(1400px)}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="220" fill="#070a14"/>
    <path fill="url(#w2)" d="M0 70 C200 30 400 110 600 70 S1000 30 1200 75 V220 H0Z"><animate attributeName="d" dur="9s" repeatCount="indefinite" values="M0 70 C200 30 400 110 600 70 S1000 30 1200 75 V220 H0Z;M0 80 C200 110 400 30 600 75 S1000 110 1200 65 V220 H0Z;M0 70 C200 30 400 110 600 70 S1000 30 1200 75 V220 H0Z"/></path>
    <path fill="url(#w1)" d="M0 100 C250 70 450 130 700 95 S1050 80 1200 105 V220 H0Z"><animate attributeName="d" dur="7s" repeatCount="indefinite" values="M0 100 C250 70 450 130 700 95 S1050 80 1200 105 V220 H0Z;M0 106 C250 132 450 72 700 102 S1050 132 1200 98 V220 H0Z;M0 100 C250 70 450 130 700 95 S1050 80 1200 105 V220 H0Z"/></path>
    <rect class="spark" x="0" y="0" width="3" height="220" fill="#22d3ee" opacity=".25"/>
    <g class="tx" text-anchor="middle">
      <text x="600" y="128" font-size="30" font-weight="800" fill="url(#brand)" letter-spacing="-.5">EvidenceGuard</text>
      <text x="600" y="156" font-size="14" fill="#e1e7ff">Rank alerts by risk, check that the explanation holds up, spend the review budget wisely.</text>
      <g class="tick"><text x="600" y="184" font-size="12.5" fill="#a9b4d6">Research prototype  |  synthetic and public benchmark data only  |  not real UPI traffic  |  no claim of UPI effectiveness</text></g>
      <text x="600" y="206" font-size="12" fill="#8793b8">MIT licensed  -  built with care by Ruchira Chowdary</text>
      <path class="beat" d="M0 0c-3-4-9-1-6 4 2 3 6 6 6 6s4-3 6-6c3-5-3-8-6-4z" transform="translate(396 200) scale(.9)" fill="#f43f5e"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="219" rx="22" fill="none" stroke="#1f2a47"/>
</svg>
