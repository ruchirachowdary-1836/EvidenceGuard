# EvidenceGuard experiment config. One config in -> results/<run_id>/ + database rows out.
name: default
seeds: [7]                       # use configs/full.yaml for 5 seeds

data:
  source: synthetic              # synthetic | ieee_cis | paysim
  raw_dir: data/raw              # ieee_cis: train_transaction.csv (+ train_identity.csv); paysim: PS_*.csv
  max_rows: null                 # optional stratified cap for development on big files
  synthetic:
    n_entities: 1400
    n_days: 60
    n_rings: 85

splits:                          # [train_end, val_end, test_end] as fractions of time-sorted rows
  folds:
    - [0.50, 0.65, 0.80]
    - [0.60, 0.75, 0.90]
    - [0.70, 0.85, 1.00]

features:
  windows_s: [3600, 86400, 604800, 2592000]   # 1 h, 24 h, 7 d, 30 d (past-only)
  history_cap: 50                             # last N past transactions for median / MAD
  cold_start_n: 5                             # fewer past txns -> IsolationForest fallback

models:
  xgb:
    n_estimators: 400
    max_depth: 5
    learning_rate: 0.07
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 2
    early_stopping_rounds: 30
  logreg_C: 1.0
  calibration: platt             # platt | isotonic (fitted on validation margins)

stability:
  k: 5                           # top-k SHAP features form the explanation
  M: 20                          # benign perturbations per transaction
  amt_tol: 0.02                  # amount jitter (sensitivity runs use 0.05)
  time_shift_s: 300              # +/- a few minutes
  delta: 0.05                    # discard perturbations that move p by more than this
  candidate_frac: 0.20           # stability only for the top fraction of each day by p

ranking:
  risk_floor: 0.05               # constrained mode: e only applied above this p
  grid:
    beta: [0.0, 0.25, 0.5, 1.0]
    gamma: [0.0, 0.25, 0.5, 1.0]
    lam: [0.0, 0.2, 0.4, 0.6]
  objective_budget: 0.05         # weights chosen on validation recall at 5% review budget

evaluation:
  budgets: [0.01, 0.05, 0.10]
  bootstrap_n: 500
  deletion_n: 300                # transactions used for the faithfulness deletion test
